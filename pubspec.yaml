name: orion
description: Companion app for the Orion voice assistant.
homepage: https://www.joinorion.io
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  multicast_dns: ^0.3.3+1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  window_manager: ^0.5.2
  tray_manager: ^0.7.0
  screen_retriever: ^0.2.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  process_run: ^1.3.6
  win32: ^6.4.0
  ffi: ^2.2.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  uuid: ^4.6.0
  intl: ^0.20.3
  riverpod: ^3.1.0
  audioplayers: ^6.8.1
  esp_ble_prov_dart: 0.5.0
  universal_ble: 1.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.5
  # Test only: the in-memory SharedPreferences backend.
  shared_preferences_platform_interface: ^2.4.1
  # Test only: StreamChannelMixin, for a fake socket that dies on demand.
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - tool/mock_device/frames/

  # Brand fonts, converted from brand/fonts (woff2) to static TTF instances.
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          weight: 400
          style: italic
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Light.ttf
          weight: 300
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          weight: 400
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Light.ttf
          weight: 300
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-LightItalic.ttf
          weight: 300
          style: italic
